# Actualizaciones de dependencias: un PR por semana con todos los minors y
# patches juntos; los majors llegan de a uno, para revisarlos aparte.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    groups:
      minor-y-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 3
    groups:
      minor-y-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(ci)
