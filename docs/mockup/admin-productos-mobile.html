<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Productos en el celular · Panel Home Bakery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&amp;family=Oswald:wght@400;500&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F4F0;color:#2F2F2F;font-family:'DM Sans',system-ui,sans-serif}
a{color:#5E4A33}a:hover{color:#2F2F2F}
.serif{font-family:'Gilda Display',Georgia,serif;font-weight:400}
.eyebrow{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#5E4A33}
.muted{color:#6B5A50}
.ph{background:#DCD1C3;border-radius:12px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;color:#5E4A33;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;border:0;background:#5E4A33;color:#FFFFFF;font-family:inherit;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer}
.btn:hover{background:#2F2F2F;color:#FFFFFF}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:999px;border:1.5px solid #2F2F2F;background:transparent;color:#2F2F2F;font-family:inherit;font-weight:600;font-size:15px;text-decoration:none;box-sizing:border-box;cursor:pointer}
.card{background:#FFFFFF;border:1px solid #E5DDD2;border-radius:20px}
.side a{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:12px;color:#E9DCD3;text-decoration:none;font-size:15px}
.side a:hover{background:#74604A;color:#FFFFFF}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.field input,.field select,.field textarea{height:48px;border-radius:12px;border:1px solid #B8A898;background:#FFFFFF;padding:0 14px;font-family:inherit;font-size:16px;font-weight:400;color:#2F2F2F;box-sizing:border-box}
.field textarea{height:110px;padding:12px 14px;resize:none;line-height:1.5}
.hint{font-size:13px;font-weight:400;color:#6B5A50}
.sw{width:52px;height:30px;border-radius:99px;border:0;padding:3px;cursor:pointer;display:flex;flex-shrink:0}
.sw span{width:24px;height:24px;border-radius:99px;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1px solid #B8A898;background:#FFFFFF;color:#2F2F2F;font-family:inherit;font-size:14px;cursor:pointer}
.chip-on{height:40px;padding:0 16px;border-radius:999px;border:1px solid #2F2F2F;background:#2F2F2F;color:#FFFFFF;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</helmet>
<div style="width: 390px; height: 1500px; display: flex; flex-direction: column; background: #F5F4F0">
<header style="position: sticky; top: 0; z-index: 10; background: #5E4A33; color: #FFFFFF; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 40px; height: 40px; border-radius: 99px; background: #A88B6C; display: flex; align-items: center; justify-content: center"><img src="../../public/brand/logo-blanco.png" alt="Home Bakery" style="width: 26px; height: auto"></span><h1 class="serif" style="margin: 0; font-size: 26px">Productos</h1></div>
<a href="inicio-desktop.html" aria-label="Ver la web" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></a>
</header>
<main style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<label style="position: relative; display: block; flex-grow: 1; max-width: none"><span style="position: absolute; left: 14px; top: 14px; color: #6B5A50"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span><span class="sr">Buscar producto</span><input type="search" placeholder="Buscar producto…" style="width: 100%; height: 48px; border-radius: 999px; border: 1px solid #B8A898; background: #FFFFFF; padding: 0 16px 0 44px; font-family: inherit; font-size: 16px; box-sizing: border-box"></label><div role="group" aria-label="Filtrar" style="display: flex; gap: 8px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<sc-if value="{{f.on}}" hint-placeholder-val="{{ false }}"><button type="button" class="chip-on" aria-pressed="true" onClick="{{f.pick}}" style="height: 44px">{{f.label}}</button></sc-if>
<sc-if value="{{f.off}}" hint-placeholder-val="{{ true }}"><button type="button" class="chip" aria-pressed="false" onClick="{{f.pick}}" style="height: 44px">{{f.label}}</button></sc-if>
</sc-for>
</div>
<sc-if value="{{toast}}" hint-placeholder-val="{{ false }}"><div role="status" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #E4EFE3; color: #1F4D2A; border-radius: 14px; padding: 8px 8px 8px 14px; font-size: 14px"><span>{{toast}}</span><button type="button" onClick="{{undo}}" style="height: 44px; padding: 0 10px; border: 0; background: transparent; color: #1F4D2A; font-family: inherit; font-weight: 600; text-decoration: underline; cursor: pointer">Deshacer</button></div></sc-if>
<sc-for list="{{rows}}" as="p" hint-placeholder-count="7">
<article class="card" style="padding: 12px; display: flex; gap: 12px; align-items: center">
<div class="ph" style="width: 72px; height: 72px; flex-shrink: 0; opacity: {{p.fade}}"></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0"><strong style="font-size: 16px">{{p.name}}</strong><span class="muted" style="font-size: 13px">{{p.cat}} · $ {{p.price}}</span><span style="font-size: 13px; font-weight: 600; color: {{p.stColor}}">{{p.stLabel}}</span></div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><button type="button" role="switch" class="sw" aria-checked="{{p.on}}" aria-label="Mostrar en la tienda" onClick="{{p.toggle}}" style="background: {{p.swBg}}; justify-content: {{p.swJust}}"><span></span></button><a href="admin-editar-producto-mobile.html" style="font-size: 14px; font-weight: 600; padding: 10px 0">Editar</a></div>
</article>
</sc-for>
</main>
<a href="admin-editar-producto-mobile.html" aria-label="Nuevo producto" style="position: fixed; right: 16px; bottom: 96px; width: 60px; height: 60px; border-radius: 99px; background: #5E4A33; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(46,37,32,.25)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
<nav aria-label="Panel" style="position: sticky; bottom: 0; background: #FFFFFF; border-top: 1px solid #E5DDD2; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 4px 14px"><a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; text-decoration: none; color: #6B5A50; font-weight: 400"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg>Inicio</a><a href="admin-pedidos-mobile.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; text-decoration: none; color: #6B5A50; font-weight: 400"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Pedidos</a><a href="admin-productos-mobile.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; text-decoration: none; color: #5E4A33; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></svg>Productos</a><a href="admin-workshops.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 12px; text-decoration: none; color: #6B5A50; font-weight: 400"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16v-7H4z"/><path d="M4 15c2 1.5 4 1.5 6 0s4-1.5 6 0 3 1.5 4 0M12 13V9"/></svg>Workshops</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'Todos', toast: '', last: null, items: [
      { id: 1, name: 'Red velvet', cat: 'Tortas', det: '[Porciones]', price: '[precio]', on: true },
      { id: 2, name: 'Tarta de frutillas', cat: 'Tartas', det: '[Porciones]', price: '[precio]', on: true },
      { id: 3, name: 'Number cake', cat: 'Number cakes', det: 'Número o inicial', price: '[precio]', on: true },
      { id: 4, name: 'Cajita de 8 cookies', cat: 'Cookies', det: 'Salted caramel, volcán, rocklets', price: '[precio]', on: true },
      { id: 5, name: 'Postres en vasito', cat: 'Postres en vasito', det: '[Unidades]', price: '[precio]', on: true },
      { id: 6, name: 'Dátiles rellenos', cat: 'Bocados', det: '[Unidades]', price: '[precio]', on: false },
      { id: 7, name: 'Rosca de Pascua', cat: 'Tortas', det: 'De temporada', price: '[precio]', on: false }
    ] };
  }
  renderVals() {
    var self = this;
    var f = this.state.filter;
    var toggle = function (id) {
      var it = self.state.items.map(function (x) { return x.id === id ? Object.assign({}, x, { on: !x.on }) : x; });
      var p = it.filter(function (x) { return x.id === id; })[0];
      self.setState({ items: it, last: id, toast: p.name + (p.on ? ' vuelve a estar en la tienda.' : ' quedó pausado y ya no se ve en la tienda.') });
    };
    return {
      toast: this.state.toast,
      undo: function () { var id = self.state.last; if (id) { toggle(id); } self.setState({ toast: '' }); },
      filters: ['Todos', 'Activos', 'Pausados'].map(function (l) { return { label: l, on: l === f, off: l !== f, pick: function () { self.setState({ filter: l }); } }; }),
      rows: this.state.items.filter(function (x) { return f === 'Todos' || (f === 'Activos') === x.on; }).map(function (x) {
        return { name: x.name, cat: x.cat, det: x.det, price: x.price, on: x.on ? 'true' : 'false', fade: x.on ? 1 : 0.45,
          swBg: x.on ? '#3E7B4E' : '#B8A898', swJust: x.on ? 'flex-end' : 'flex-start',
          stLabel: x.on ? 'Activo' : 'Pausado', stColor: x.on ? '#2E6B3F' : '#6B5A50',
          toggle: function () { toggle(x.id); } };
      })
    };
  }
}
</script>
</body>
</html>
