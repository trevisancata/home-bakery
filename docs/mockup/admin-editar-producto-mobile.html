<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editar producto en el celular · Panel Home Bakery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&amp;family=Oswald:wght@400;500&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F4F0;color:#2F2F2F;font-family:'DM Sans',system-ui,sans-serif}
a{color:#5E4A33}a:hover{color:#2F2F2F}
.serif{font-family:'Gilda Display',Georgia,serif;font-weight:400}
.eyebrow{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#5E4A33}
.muted{color:#6B5A50}
.ph{background:#DCD1C3;border-radius:12px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;color:#5E4A33;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;border:0;background:#5E4A33;color:#FFFFFF;font-family:inherit;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer}
.btn:hover{background:#2F2F2F;color:#FFFFFF}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:999px;border:1.5px solid #2F2F2F;background:transparent;color:#2F2F2F;font-family:inherit;font-weight:600;font-size:15px;text-decoration:none;box-sizing:border-box;cursor:pointer}
.card{background:#FFFFFF;border:1px solid #E5DDD2;border-radius:20px}
.side a{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:12px;color:#E9DCD3;text-decoration:none;font-size:15px}
.side a:hover{background:#74604A;color:#FFFFFF}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.field input,.field select,.field textarea{height:48px;border-radius:12px;border:1px solid #B8A898;background:#FFFFFF;padding:0 14px;font-family:inherit;font-size:16px;font-weight:400;color:#2F2F2F;box-sizing:border-box}
.field textarea{height:110px;padding:12px 14px;resize:none;line-height:1.5}
.hint{font-size:13px;font-weight:400;color:#6B5A50}
.sw{width:52px;height:30px;border-radius:99px;border:0;padding:3px;cursor:pointer;display:flex;flex-shrink:0}
.sw span{width:24px;height:24px;border-radius:99px;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1px solid #B8A898;background:#FFFFFF;color:#2F2F2F;font-family:inherit;font-size:14px;cursor:pointer}
.chip-on{height:40px;padding:0 16px;border-radius:999px;border:1px solid #2F2F2F;background:#2F2F2F;color:#FFFFFF;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</helmet>
<div style="width: 390px; height: 1900px; display: flex; flex-direction: column; background: #F5F4F0">
<header style="position: sticky; top: 0; z-index: 10; background: #F5F4F0; border-bottom: 1px solid #E5DDD2; padding: 10px 8px; display: flex; align-items: center; gap: 4px">
<a href="admin-productos-mobile.html" aria-label="Volver a productos" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2F2F2F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 class="serif" style="margin: 0; font-size: 24px">Editar producto</h1>
</header>
<main style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px">
<section class="card" aria-labelledby="m-fotos" style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 id="m-fotos" style="margin: 0; font-size: 16px">Fotos</h2>
<div style="display: flex; gap: 10px">
<div style="position: relative"><div class="ph" style="width: 96px; height: 96px"></div><span style="position: absolute; top: 8px; left: 8px; background: #2F2F2F; color: #FFFFFF; font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 99px">Portada</span><button type="button" aria-label="Quitar foto 1" style="position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: 99px; border: 0; background: #FFFFFF; color: #2F2F2F; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div style="position: relative"><div class="ph" style="width: 96px; height: 96px">Foto 2</div><button type="button" aria-label="Quitar foto 2" style="position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: 99px; border: 0; background: #FFFFFF; color: #2F2F2F; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<label style="position: relative; width: 96px; height: 96px; border: 1.5px dashed #A88B6C; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E4A33; font-size: 12px; font-weight: 600; text-align: center; box-sizing: border-box; padding: 4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>Sacar o subir foto<input type="file" accept="image/*" capture="environment" class="sr"></label>
</div>
<span class="hint">Podés sacarla con la cámara del celu en el momento.</span>
</section>
<section class="card" aria-labelledby="m-info" style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
<h2 id="m-info" style="margin: 0; font-size: 16px">Información</h2>
<label class="field">Nombre<input type="text" value="Red velvet"></label>
<label class="field">Categoría<select><option>Tortas</option><option>Tartas</option><option>Number cakes</option><option>Cookies</option><option>Postres en vasito</option><option>Bocados</option></select></label>
<label class="field">Descripción<textarea>[Cómo es y para cuántas personas rinde.]</textarea></label>
</section>
<section class="card" aria-labelledby="m-precio" style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 id="m-precio" style="margin: 0; font-size: 16px">Tamaños y precios</h2>
<div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid #E5DDD2"><label class="field">Tamaño<input type="text" value="Chica · 10 porciones"></label><label class="field">Precio<input type="text" inputmode="numeric" value="$ [precio]"></label></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label class="field">Tamaño<input type="text" value="Grande · 20 porciones"></label><label class="field">Precio<input type="text" inputmode="numeric" value="$ [precio]"></label></div>
<button type="button" class="btn2" style="height: 44px; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Agregar tamaño</button>
</section>
<section class="card" aria-labelledby="m-vis" style="padding: 16px; display: flex; flex-direction: column; gap: 16px">
<h2 id="m-vis" style="margin: 0; font-size: 16px">Visibilidad y encargo</h2>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px"><div style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px">Mostrar en la tienda</strong><span class="hint">Si lo pausás, no se puede encargar.</span></div><button type="button" role="switch" class="sw" aria-checked="{{vis}}" aria-label="Mostrar en la tienda" onClick="{{toggleVis}}" style="background: {{visBg}}; justify-content: {{visJust}}"><span></span></button></div><div style="display: flex; justify-content: space-between; align-items: center; gap: 16px"><div style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px">Destacado en el inicio</strong><span class="hint">Sale en "Los favoritos de la casa".</span></div><button type="button" role="switch" class="sw" aria-checked="{{fav}}" aria-label="Destacado en el inicio" onClick="{{toggleFav}}" style="background: {{favBg}}; justify-content: {{favJust}}"><span></span></button></div><label class="field">Anticipación mínima<select><option>48 horas (la de siempre)</option><option>72 horas</option><option>1 semana</option></select><span class="hint">Para productos que llevan más trabajo, como los number cakes.</span></label>
</section>
<button type="button" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; height: 44px; border: 0; background: transparent; color: #B3261E; font-family: inherit; font-weight: 600; font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>Eliminar producto</button>
</main>
<div style="position: sticky; bottom: 0; background: #FFFFFF; border-top: 1px solid #E5DDD2; padding: 12px 16px 20px; display: flex; gap: 10px">
<a class="btn2" href="admin-productos-mobile.html" style="flex-grow: 1">Cancelar</a><a class="btn" href="admin-productos-mobile.html" style="flex-grow: 2">Guardar</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { vis: true, fav: true }; }
  renderVals() {
    var self = this, v = this.state.vis, f = this.state.fav;
    return {
      vis: v ? 'true' : 'false', visBg: v ? '#3E7B4E' : '#B8A898', visJust: v ? 'flex-end' : 'flex-start',
      fav: f ? 'true' : 'false', favBg: f ? '#3E7B4E' : '#B8A898', favJust: f ? 'flex-end' : 'flex-start',
      toggleVis: function () { self.setState({ vis: !v }); },
      toggleFav: function () { self.setState({ fav: !f }); }
    };
  }
}
</script>
</body>
</html>
